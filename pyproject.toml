[build-system]
# >=77 for the SPDX ``license`` expression used below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyCamSet"
version = "1.1.2"
description = "Object oriented cameras for computer vision"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Robin Laven", email = "r.laven@auckland.ac.nz"},
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    # >=4.8: CharucoBoard.setLegacyPattern and the CharucoDetector API.
    # No upper bound: the 4.x/5.x differences are handled at the call sites
    # (detectBoard's squeezed returns, stereoRectify's column-vector T, and
    # putText's 8-bit assertion).  Note that OpenCV 5 shifts detected ChArUco
    # corners by about half a pixel, so calibrations are not numerically
    # comparable across the major versions.
    "opencv-python>=4.8",
    "tqdm",
    "numba",
    "natsort",
    "coloredlogs",
    "blosc",
    "uniplot",
    "scikit-learn",
    "scikit-image",
    "dill",
    "cairosvg",
    "svgwrite",
    "pillow",
    # Plotting is part of the default surface, not an add-on: camera_set,
    # visualisation, template_handler and reconstruction_utils all draw with
    # it.  pyvista renders through VTK and pulls in no Qt binding, so this
    # stays true of a headless install.
    "pyvista",
    # The GUI is the default install, so its one hard dependency is a base
    # dependency.  It is also by far the largest -- see requirements_core.txt
    # for the lean install that leaves it out.
    "PySide6",
]

[project.urls]
Homepage = "https://github.com/rlav440/pyCamSet"
Repository = "https://github.com/rlav440/pyCamSet"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout",
    "pytest-cov",
]
optimisation = ["optuna"]
# Empty: PySide6 is a base dependency now, so the GUI needs nothing extra.
# The name is kept so ``pip install pyCamSet[gui]`` stays valid for anyone
# who already writes it.
gui = []
# A second 3D renderer used by the lockbox editor and one visualisation path.
# Kept separate from the base install because it is a large download and
# everything it draws has a pyvista equivalent.
viz = ["open3d"]
puzzle = ["puzzle_board @ git+https://github.com/PStelldinger/PuzzleBoard.git"]
# Defined in terms of the others so it cannot drift out of step with them --
# the setup.cfg version had already lost pytest-cov this way.
all = ["pyCamSet[dev,optimisation,gui,viz,puzzle]"]

[project.scripts]
pycamset = "pyCamSet.gui.__main__:main"

[tool.setuptools]
include-package-data = true

# The ChArUco detector parameter table is data the library reads at import,
# so it has to be in the wheel.  include-package-data alone does not put it
# there: with no MANIFEST.in and no VCS plugin, setuptools has nothing to
# discover it from.
[tool.setuptools.package-data]
"pyCamSet.calibration_targets.markers" = ["*.json"]

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Keep both naming conventions used by the maintained test inventory.
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["pyCamSet"]
omit = [
    # Generated build output, not source: abstract_function_blocks.make_*
    # writes these files, and every function in them is an njit kernel whose
    # body CPython never executes.  Measuring them reports 6-33% forever and
    # tells you nothing about the tests.
    "pyCamSet/optimisation/template_functions/*",
]

[tool.coverage.report]
show_missing = true
# Coverage is reported from the fast suite with JIT ON (see
# .github/workflows/test.yml), so it measures the code that ships.
#
# The consequence is that @njit kernel bodies read as unexecuted: CPython
# never runs them, numba compiles them.  compiled_helpers.py therefore reports
# about 14% rather than the 46% an interpreted run shows, and the project total
# is roughly a point lower (33% against 34%).  Those kernels are covered
# behaviourally -- by the bundle adjustments in the data-marked tests -- not by
# line counting.  Do not re-enable NUMBA_DISABLE_JIT to flatter this number:
# it also skips every needs_jit test, which is where the compiled path's own
# regressions are caught.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
