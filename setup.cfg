[metadata]
name = pyCamSet


version = 1.1.2


author = Robin Laven
author_email = r.laven@auckland.ac.nz
description = Object oriented cameras for computer vision
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/rlav440/pyCamSet
repository = https://github.com/rlav440/pyCamSet
license = "Apache-2.0"

[options]
packages = find:
python_requires = >=3.11
include_package_data = True
install_requires =
    numpy
    pyvista
    scipy
    matplotlib
    # >=4.8: CharucoBoard.setLegacyPattern and the CharucoDetector API.
    # <5:    OpenCV 5 squeezes CharucoDetector.detectBoard's return shapes,
    #        which breaks ChArUco detection (see tests/test_calibration_charuco.py).
    opencv-python>=4.8,<5
    tqdm
    numba
    natsort
    coloredlogs
    blosc
    uniplot
    scikit-learn
    dill

[options.packages.find]
exclude =
    tests*
    examples*

[options.extras_require]
dev =
    pytest>=7.0
    pytest-timeout
    pytest-cov
