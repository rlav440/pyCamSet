name: tests

on:
  push:
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result, not just the first failure: the point
      # of the matrix is to find the platform-specific breakage.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Record the resolved native dependencies
        # opencv-python is unpinned upstream and resolves differently per
        # platform and per Python version; log what we actually got so a
        # platform-only failure can be traced to it.
        run: |
          python -c "import sys, numpy, cv2, numba; print('python', sys.version)"
          python -c "import numpy, cv2, numba; print('numpy', numpy.__version__); print('cv2', cv2.__version__); print('numba', numba.__version__)"

      - name: Fast tests
        # No image corpus, no display, no optional dependencies.
        run: pytest -m "not data" --timeout=600

      - name: Full suite
        run: pytest --timeout=1800
