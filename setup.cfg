[metadata]
name = pyCamSet


version = 1.1.2


author = Robin Laven
author_email = r.laven@auckland.ac.nz
description = Object oriented cameras for computer vision
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/rlav440/pyCamSet
repository = https://github.com/rlav440/pyCamSet
license = "Apache-2.0"

[options]
packages = find:
python_requires = >=3.11
include_package_data = True
install_requires =
    numpy
    scipy
    matplotlib
    # >=4.8: CharucoBoard.setLegacyPattern and the CharucoDetector API.
    # No upper bound: the 4.x/5.x differences are handled at the call sites
    # (detectBoard's squeezed returns, stereoRectify's column-vector T, and
    # putText's 8-bit assertion).  Note that OpenCV 5 shifts detected ChArUco
    # corners by about half a pixel, so calibrations are not numerically
    # comparable across the major versions.
    opencv-python>=4.8
    tqdm
    numba
    natsort
    coloredlogs
    blosc
    uniplot
    scikit-learn
    scikit-image
    dill
    cairosvg
    svgwrite
    pillow

[options.packages.find]
exclude =
    tests*
    examples*

[options.extras_require]
dev =
    pytest>=7.0
    pytest-timeout
    pytest-cov
optimisation =
    optuna
gui =
    PySide6
viz =
    open3d
    pyvista
puzzle =
    puzzle_board @ git+https://github.com/PStelldinger/PuzzleBoard.git
all =
    pytest>=7.0
    pytest-timeout
    pytest-cov
    optuna
    PySide6
    open3d
    pyvista
    puzzle_board @ git+https://github.com/PStelldinger/PuzzleBoard.git
