name: tests

on:
  push:
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }} · cv${{ matrix.opencv }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result, not just the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        # opencv-python carries no upper bound, so pip resolves it to 5.x
        # everywhere.  Pin the major version per job instead of letting the
        # resolver decide: without the explicit 4.x entries below, the
        # supported floor would stop being exercised the day 5.x shipped.
        opencv: [">=5"]
        include:
          - {os: ubuntu-latest, python: "3.12", opencv: "<5"}
          - {os: windows-latest, python: "3.12", opencv: "<5"}
          - {os: macos-14, python: "3.12", opencv: "<5"}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "opencv-python${{ matrix.opencv }}"

      - name: Record the resolved native dependencies
        # The OpenCV major version is pinned per job, but the exact build still
        # differs per platform and per Python version; log what we actually got
        # so a platform-only failure can be traced to it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record resolved runtime dependencies
        # Log native versions so platform-only failures are attributable.
        run: |
          python -c "import sys, numpy, cv2, numba; print('python', sys.version); print('numpy', numpy.__version__); print('cv2', cv2.__version__); print('numba', numba.__version__)"

      - name: Fast tests
        # No image corpus, no display, no optional dependencies.
        #
        # NUMBA_DISABLE_JIT so the @njit kernels are interpreted and therefore
        # visible to coverage; with JIT on, coverage reports every kernel body
        # as unexecuted and the number means nothing.  The full suite below
        # keeps JIT on, because a pure-Python bundle adjustment is far too slow.
        env:
          NUMBA_DISABLE_JIT: "1"
        run: pytest -m "not data" --timeout=600 --cov --cov-report=term-missing

      - name: Full suite
        run: python -m pytest --timeout=1800
