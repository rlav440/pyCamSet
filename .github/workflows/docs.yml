name: docs

# The published site is assembled from two branches on every run:
#
#   master      -> /        the release docs
#   development -> /dev     the in-progress docs
#
# Both are built from their own checkout, so each uses its own configuration and
# its own toolchain.  Because the build job checks the two branches out
# explicitly rather than relying on the triggering ref, a push to either branch
# republishes the whole site and neither half can go stale.
#
# Note that a push to master only triggers this workflow once this file exists
# on master -- Actions reads workflows from the branch that was pushed.  While
# master is still on the sphinx docs, the master half is built by the sphinx
# steps below; both halves become mkdocs once development is merged down.

on:
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time.  Queue them rather than cancelling, so
# a master push and a development push cannot race and drop half the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # On a pull request, build that PR's own docs as a check and publish nothing.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The ChArUco2 and Ccube2 pages draw their targets as the site is built,
      # and those targets are read with aruco2, which lives in the submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The examples in the docs are executed and drawn as the site is built,
      # and VTK still needs a GL context to render into.
      - uses: pyvista/setup-headless-display-action@v3

      # cairo rasterises the printable exports; OpenCV's development package is
      # what aruco2 is compiled against.
      - name: Install the native graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libopencv-dev

      # The examples on these pages run a real calibration as the site is built,
      # so unlike the sphinx-autoapi build this replaced -- which never imported
      # the package at all -- pyCamSet and its whole runtime stack have to be
      # installed here.
      - run: pip install -e ".[docs]"

      # aruco2 is not on PyPI, so the pages that draw a ChArUco2 or a Ccube2
      # need it built from the submodule.  See "Installing the aruco2 backend"
      # in CITATION.md.  Compiling it is minutes of C++ that the submodule's
      # commit decides entirely, so the wheel is kept against that commit --
      # and against the OpenCV it was compiled against, which is the runtime it
      # goes on linking to.
      - name: Identify the aruco2 build
        id: aruco2
        run: |
          echo "sha=$(git -C third_party/aruco2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "opencv=$(dpkg-query -W -f='${Version}' libopencv-dev)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: aruco2-wheel
        with:
          path: ~/aruco2-wheel
          key: >-
            aruco2-${{ runner.os }}-py3.11-${{ steps.aruco2.outputs.opencv }}-${{ steps.aruco2.outputs.sha }}

      - name: Build aruco2
        if: steps.aruco2-wheel.outputs.cache-hit != 'true'
        run: pip wheel -v ./third_party/aruco2 -w ~/aruco2-wheel --no-deps

      - run: pip install --no-index --find-links ~/aruco2-wheel aruco2

      - run: python -m mkdocs build --strict

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          path: development
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: pyvista/setup-headless-display-action@v3

      - name: Install the native graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libcairo2 libopencv-dev

      # master is still the sphinx tree, and its toolchain is listed in the file
      # it has always been listed in -- except for sphinx-copybutton, which its
      # conf.py loads but its requirements have never named.  Development's
      # requirements did name it, and this job used to install both files, so
      # master's build had been borrowing it; with development on mkdocs there
      # is no second file to borrow from.  Named here rather than fixed on
      # master, because this whole step goes away when master catches up.
      - name: Install master's sphinx toolchain
        run: pip install -r master/docs/doq_reqs.txt sphinx-copybutton

      - name: Build master into the site root
        run: python -m sphinx -b html master/docs/source _site

      - name: Install development's mkdocs toolchain
        run: pip install -e "./development[docs]"

      # Built from development's submodule: master's sphinx build imports
      # nothing, so only the mkdocs half needs it.  Cached the same way, and
      # under the same key, as the pull request check builds it.
      - name: Identify the aruco2 build
        id: aruco2
        run: |
          echo "sha=$(git -C development/third_party/aruco2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "opencv=$(dpkg-query -W -f='${Version}' libopencv-dev)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: aruco2-wheel
        with:
          path: ~/aruco2-wheel
          key: >-
            aruco2-${{ runner.os }}-py3.11-${{ steps.aruco2.outputs.opencv }}-${{ steps.aruco2.outputs.sha }}

      - name: Build development's aruco2 backend
        if: steps.aruco2-wheel.outputs.cache-hit != 'true'
        run: pip wheel -v ./development/third_party/aruco2 -w ~/aruco2-wheel --no-deps

      - run: pip install --no-index --find-links ~/aruco2-wheel aruco2

      # development is warning-free, so it is held to that with --strict.
      - name: Build development into /dev
        working-directory: development
        run: python -m mkdocs build --strict --site-dir ../_site/dev

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
