[metadata]
name = pyCamSet


version = 1.1.2


author = Robin Laven
author_email = r.laven@auckland.ac.nz
description = Object oriented cameras for computer vision
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/rlav440/pyCamSet
repository = https://github.com/rlav440/pyCamSet
license = "Apache-2.0"

[options]
packages = find:
python_requires = >=3.11
include_package_data = True
install_requires =
    numpy
    scipy
    matplotlib
    # ChArUco current API support; OpenCV 5 return-shape changes are out of scope.
    opencv-python>=4.8,<5
    tqdm
    numba
    natsort
    coloredlogs
    blosc
    uniplot
    scikit-learn
    scikit-image
    dill
    cairosvg
    svgwrite
    pillow

[options.packages.find]
exclude =
    tests*
    examples*

[options.extras_require]
dev =
    pytest>=7.0
    pytest-timeout
optimisation =
    optuna
gui =
    PySide6
viz =
    open3d
    pyvista
puzzle =
    puzzle_board @ git+https://github.com/PStelldinger/PuzzleBoard.git
all =
    pytest>=7.0
    pytest-timeout
    optuna
    PySide6
    open3d
    pyvista
    puzzle_board @ git+https://github.com/PStelldinger/PuzzleBoard.git
