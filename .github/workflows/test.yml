name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} - py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Record resolved runtime dependencies
        run: |
          python -c "import sys, numpy, cv2, numba; print('python', sys.version); print('numpy', numpy.__version__); print('cv2', cv2.__version__); print('numba', numba.__version__)"

      - name: Fast tests
        run: python -m pytest -m "not data" --timeout=600

      - name: Full suite
        run: python -m pytest --timeout=1800
